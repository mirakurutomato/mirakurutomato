<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="152" viewBox="0 0 1200 152" role="img" aria-label="Highlights: IEEE GCCE 2026 lead author; 6 papers and talks; 4 awards at the Tongali 2026 finals; 16.7k lines shipped as open source">
  <style>
    .num{font:700 34px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#4dbec7;letter-spacing:-.5px}
    .lbl{font:500 14px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#a9c3c6}
    .tile{opacity:0;animation:up .7s ease-out forwards}
    .t2{animation-delay:.12s}.t3{animation-delay:.24s}.t4{animation-delay:.36s}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  </style>
  <g transform="translate(0 24)">
  <g class="tile"><rect x="0" y="4" width="276" height="120" rx="18" fill="#0f1f22" stroke="#1f3a3f"/><text class="num" x="138" y="62" text-anchor="middle">IEEE</text><text class="lbl" x="138" y="92" text-anchor="middle">GCCE 2026 · lead author</text></g>
  <g class="tile t2"><rect x="308" y="4" width="276" height="120" rx="18" fill="#0f1f22" stroke="#1f3a3f"/><text class="num" x="446" y="62" text-anchor="middle">6</text><text class="lbl" x="446" y="92" text-anchor="middle">papers &amp; talks</text></g>
  <g class="tile t3"><rect x="616" y="4" width="276" height="120" rx="18" fill="#0f1f22" stroke="#1f3a3f"/><text class="num" x="754" y="62" text-anchor="middle">4</text><text class="lbl" x="754" y="92" text-anchor="middle">awards · Tongali 2026 finals (114 teams)</text></g>
  <g class="tile t4"><rect x="924" y="4" width="276" height="120" rx="18" fill="#0f1f22" stroke="#1f3a3f"/><text class="num" x="1062" y="62" text-anchor="middle">16.7k</text><text class="lbl" x="1062" y="92" text-anchor="middle">lines shipped · open source</text></g>
  </g>
</svg>
