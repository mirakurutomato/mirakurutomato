<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Toma Okugawa — builds and researches computer-vision systems for people who learn on their own">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3fafb"/><stop offset="1" stop-color="#dff2f4"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4dbec7"/><stop offset="1" stop-color="#2e9aa4"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="28"/></clipPath>
    <style>
      .name{font:700 58px "Segoe UI","Helvetica Neue",Arial,"Noto Sans JP",sans-serif;fill:#1a2b2e;letter-spacing:-1px}
      .kana{font:500 23px "Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;fill:#52666a}
      .tag{font:400 21px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#1a2b2e}
      .chip{font:600 14px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#14545b;letter-spacing:.2px}
      .rot{font:600 20px "SFMono-Regular","Cascadia Mono",Consolas,Menlo,monospace;fill:#2e9aa4;opacity:0;animation:cyc 9s infinite}
      .rot.b{animation-delay:3s}.rot.c{animation-delay:6s}
      @keyframes cyc{0%{opacity:0}5%{opacity:1}30%{opacity:1}35%{opacity:0}100%{opacity:0}}
      .arc{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.6s cubic-bezier(.2,.7,.2,1) .2s forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .dot{opacity:0;animation:pop .5s 1.4s forwards}
      @keyframes pop{to{opacity:1}}
      .ring{transform-box:fill-box;transform-origin:50% 50%;animation:spin 80s linear infinite}
      .ring2{transform-box:fill-box;transform-origin:50% 50%;animation:spin 120s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .fade{opacity:0;animation:fadeup .9s ease-out forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.d5{animation-delay:.75s}
      @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- decorative rings (echo of the logo) -->
    <g opacity="0.55">
      <g class="ring"><circle cx="1010" cy="160" r="150" fill="none" stroke="#4dbec7" stroke-width="1.5" stroke-dasharray="6 14"/></g>
      <g class="ring2"><circle cx="1010" cy="160" r="112" fill="none" stroke="#2e9aa4" stroke-width="1.2" stroke-dasharray="2 10"/></g>
      <circle cx="1010" cy="160" r="74" fill="none" stroke="#4dbec7" stroke-width="1"/>
      <circle cx="1010" cy="160" r="36" fill="none" stroke="#2e9aa4" stroke-width="1"/>
      <circle cx="1124" cy="62" r="5" fill="#4dbec7"/>
      <circle cx="896" cy="258" r="3.5" fill="#2e9aa4"/>
    </g>
    <!-- logo mark: arc draws in, dot pops -->
    <g transform="translate(118 118) scale(2.35)">
      <path class="arc" d="M -3.365 -19.086 A 19.38 19.38 0 1 0 19.086 -3.365" fill="none" stroke="#4dbec7" stroke-width="6.84" stroke-linecap="round"/>
      <circle class="dot" cx="7.883" cy="-17.705" r="4.56" fill="#14545b"/>
    </g>
    <!-- text -->
    <text class="name fade d1" x="212" y="118">Toma Okugawa</text>
    <text class="kana fade d2" x="212" y="152">奥河 董馬 — Student researcher · builder</text>
    <text class="tag fade d3" x="212" y="198">Builds &amp; researches computer-vision systems for people who learn on their own.</text>
    <g transform="translate(212 236)">
      <text class="rot a" x="0" y="0">&gt; ships production systems on the edge</text>
      <text class="rot b" x="0" y="0">&gt; publishes on pose estimation &amp; low-light imaging</text>
      <text class="rot c" x="0" y="0">&gt; open-sources everything, in Japanese and English</text>
    </g>
    <!-- chips -->
    <g transform="translate(212 262)"><g class="fade d4">
      <rect width="166" height="32" rx="16" fill="#ffffff" stroke="#c3d3d5"/><text class="chip" x="83" y="21" text-anchor="middle">Yuge Island, Japan</text>
      <g transform="translate(178 0)"><rect width="214" height="32" rx="16" fill="#ffffff" stroke="#c3d3d5"/><text class="chip" x="107" y="21" text-anchor="middle">NIT Yuge College · KOSEN</text></g>
      <g transform="translate(404 0)"><rect width="250" height="32" rx="16" fill="#ffffff" stroke="#c3d3d5"/><text class="chip" x="125" y="21" text-anchor="middle">Lead author · IEEE GCCE 2026</text></g>
    </g></g>
  </g>
</svg>
