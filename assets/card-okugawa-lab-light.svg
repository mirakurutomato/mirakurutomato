<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="okugawa-lab — membership video platform running in production entirely on the edge; TypeScript, AGPL-3.0">
  <style>
    .own{font:500 15px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#52666a}
    .ttl{font:700 24px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#2e9aa4;letter-spacing:-.3px}
    .dsc{font:400 15px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#1a2b2e}
    .chip{font:600 12.5px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#14545b}
    .lnk{font:700 15px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#2e9aa4}
    .url{font:500 12.5px "SFMono-Regular","Cascadia Mono",Consolas,Menlo,monospace;fill:#5f7477}
    .in{opacity:0;animation:fade .8s ease-out forwards}
    .i2{animation-delay:.15s}.i3{animation-delay:.3s}.i4{animation-delay:.45s}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .arc{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.2s cubic-bezier(.2,.7,.2,1) .2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
  <rect x="0.5" y="0.5" width="599" height="279" rx="18" fill="#ffffff" stroke="#dde7e8"/>
  <g transform="translate(46 46) scale(1.05)">
    <path class="arc" d="M -3.365 -19.086 A 19.38 19.38 0 1 0 19.086 -3.365" fill="none" stroke="#4dbec7" stroke-width="6.84" stroke-linecap="round"/>
    <circle cx="7.883" cy="-17.705" r="4.56" fill="#4dbec7"/>
  </g>
  <g class="in">
    <text class="own" x="86" y="38">toma-okugawa /</text>
    <text class="ttl" x="86" y="66">okugawa-lab</text>
  </g>
  <g class="in i2">
    <text class="dsc" x="32" y="112">Membership video platform running in production, entirely on the edge.</text>
    <text class="dsc" x="32" y="136">Next.js 16 · Cloudflare Workers · Firebase (no firebase-admin) · R2 · ja / en</text>
  </g>
  <g class="in i3" transform="translate(32 166)">
    <rect width="112" height="28" rx="14" fill="#f3fafb" stroke="#c3d3d5"/><circle cx="16" cy="14" r="5" fill="#3178c6"/><text class="chip" x="28" y="18.5">TypeScript</text>
    <g transform="translate(122 0)"><rect width="88" height="28" rx="14" fill="#f3fafb" stroke="#c3d3d5"/><text class="chip" x="44" y="18.5" text-anchor="middle">AGPL-3.0</text></g>
    <g transform="translate(220 0)"><rect width="96" height="28" rx="14" fill="#f3fafb" stroke="#c3d3d5"/><text class="chip" x="48" y="18.5" text-anchor="middle">Production</text></g>
    <g transform="translate(326 0)"><rect width="182" height="28" rx="14" fill="#f3fafb" stroke="#c3d3d5"/><text class="chip" x="91" y="18.5" text-anchor="middle">Reference implementation</text></g>
  </g>
  <g class="in i4">
    <line x1="32" y1="216" x2="568" y2="216" stroke="#dde7e8"/>
    <text class="lnk" x="32" y="248">View the repository  →</text>
    <text class="url" x="568" y="248" text-anchor="end">github.com/toma-okugawa/okugawa-lab</text>
  </g>
</svg>
